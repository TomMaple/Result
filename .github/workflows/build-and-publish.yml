# This workflow will build and publish a NuGet library
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and publish

on:
  push:
    branches: [ "**" ]
    # branches: [ "main" ]
    paths: [ "src/**", "tests/**", ".github/workflows/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - uses: paulhatch/semantic-version@v5.4.0
      id: semantic_version
      with:
        bump_each_commit: true
        version_format: ${major}.${minor}.${patch}-prerelease${increment}+{commit}

    - name: Display all outputs from the previous step
      run: echo "${{ toJSON(steps.semantic_version.outputs) }}"
      shell: bash

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -p:Version=${{ steps.semantic_version.outputs.version }} --configuration Release --verbosity normal

    - name: Test
      run: dotnet test --no-build --verbosity normal
