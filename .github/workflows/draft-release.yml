# Creates a draft GitHub Release for the current main commit, with notes generated by git-cliff (cliff.toml).
# Review and edit the notes in the GitHub UI, then publish the release: that creates the tag and triggers "Publish".
# No tag is created here, so discarding the draft leaves nothing behind.

name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 3.0.0 or 3.0.0-rc.1. Leave empty to calculate it from the commits."
        required: false
        default: ""

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check branch
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::error::Releases are drafted from main only (got ${GITHUB_REF})."
        exit 1

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get bumped version
      id: git_cliff
      uses: orhun/git-cliff-action@v4.9.1
      with:
        version: v2.14.2
        args: --bumped-version

    - name: Resolve version
      id: version
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="${INPUT_VERSION#v}"
        else
          VERSION=$(python3 -I .github/scripts/version.py next "$BUMPED")
        fi
        PREVIOUS=$(python3 -I .github/scripts/version.py validate "$VERSION")
        if [ -z "$PREVIOUS" ]; then
          echo "::error::No v* tag found. Create the baseline tag first."
          exit 1
        fi
        if [ -z "$(git rev-list "${PREVIOUS}..HEAD")" ]; then
          echo "::error::No commits since ${PREVIOUS}. Nothing to release."
          exit 1
        fi
        PRERELEASE=false
        [[ "$VERSION" == *-* ]] && PRERELEASE=true
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
        echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION} (previous: ${PREVIOUS}, pre-release: ${PRERELEASE})"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        BUMPED: ${{ steps.git_cliff.outputs.content }}

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}+${{ github.sha }} --configuration Release --verbosity normal

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Generate release notes
      uses: orhun/git-cliff-action@v4.9.1
      with:
        version: v2.14.2
        args: --unreleased --tag v${{ steps.version.outputs.version }} --strip all -o ${{ runner.temp }}/notes.md

    # cliff.toml already renders a fallback text when every commit is filtered out. This also covers
    # git-cliff omitting the release entirely.
    - name: Check release notes
      id: notes
      run: |
        if [ -z "$(tr -d '[:space:]' < "$NOTES")" ]; then
          printf '%s\n\n%s\n\n%s\n' \
            "No consumer-facing changes. Build and test dependency updates only." \
            "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...v${VERSION}" \
            "📦 NuGet: https://www.nuget.org/packages/Maple.Result/${VERSION}" > "$NOTES"
        fi
        if grep -q '^### ' "$NOTES"; then
          echo "consumer_facing=true" >> "$GITHUB_OUTPUT"
        else
          echo "consumer_facing=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No consumer-facing changes since ${PREVIOUS}. The draft is created anyway; consider discarding it."
        fi
        cat "$NOTES"
      env:
        NOTES: ${{ runner.temp }}/notes.md
        VERSION: ${{ steps.version.outputs.version }}
        PREVIOUS: ${{ steps.version.outputs.previous }}

    - name: Create draft release
      id: release
      run: |
        TAG="v${VERSION}"
        if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::A published release ${TAG} already exists."
            exit 1
          fi
          echo "Deleting the existing draft ${TAG}."
          gh release delete "$TAG" --yes
        fi
        ARGS=(--draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES")
        [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
        URL=$(gh release create "$TAG" "${ARGS[@]}")
        echo "url=${URL}" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES: ${{ runner.temp }}/notes.md
        VERSION: ${{ steps.version.outputs.version }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}

    - name: Summary
      run: |
        {
          echo "## Draft release v${VERSION}"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Version | \`${VERSION}\`$([ "$PRERELEASE" = "true" ] && echo ' (pre-release)') |"
          echo "| Previous tag | \`${PREVIOUS}\` |"
          echo "| Target | [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
          echo "| Draft | ${URL} |"
          echo
          if [ "$CONSUMER_FACING" != "true" ]; then
            echo "> [!WARNING]"
            echo "> No consumer-facing changes since ${PREVIOUS}. A release is usually not worth cutting; discard the draft unless you need it."
            echo
          fi
          echo "Review and edit the notes, then **Publish release** to create the tag and push the package to NuGet."
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        VERSION: ${{ steps.version.outputs.version }}
        PREVIOUS: ${{ steps.version.outputs.previous }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}
        CONSUMER_FACING: ${{ steps.notes.outputs.consumer_facing }}
        URL: ${{ steps.release.outputs.url }}
