# Builds, tests and packs the library on every push and pull request. Nothing is published from here:
# releases go through the "Draft release" and "Publish" workflows (see docs/conventions.md, "Releasing").
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "**" ]
    paths: [ "src/**", "tests/**", ".github/workflows/**" ]
  pull_request:
    branches: [ "main" ]

env:
  ARTIFACTS_PATH: ${{ github.workspace }}/artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get bumped version
      id: git_cliff
      uses: orhun/git-cliff-action@v4.9.1
      with:
        version: v2.14.2
        args: --bumped-version

    - name: Calculate version
      id: calculate_version
      run: |
        NEXT=$(python3 -I .github/scripts/version.py next "$BUMPED")
        echo "package_version=${NEXT}-ci.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "informational_version=${NEXT}-ci.${RUN_NUMBER}+${COMMIT}" >> "$GITHUB_OUTPUT"
        echo "Package version: ${NEXT}-ci.${RUN_NUMBER}"
        echo "Informational version: ${NEXT}-ci.${RUN_NUMBER}+${COMMIT}"
      env:
        BUMPED: ${{ steps.git_cliff.outputs.content }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT: ${{ github.sha }}

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -p:Version=${{ steps.calculate_version.outputs.package_version }} -p:InformationalVersion=${{ steps.calculate_version.outputs.informational_version }} --configuration Release --verbosity normal

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Generate NuGet package
      run: dotnet pack src/Maple.Result/Maple.Result.csproj --no-build -o ${{ env.ARTIFACTS_PATH }} -p:Version=${{ steps.calculate_version.outputs.package_version }} -p:InformationalVersion=${{ steps.calculate_version.outputs.informational_version }} --configuration Release

    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-${{ steps.calculate_version.outputs.package_version }}
        path: |
          ${{ env.ARTIFACTS_PATH }}/*.nupkg
          ${{ env.ARTIFACTS_PATH }}/*.snupkg
        if-no-files-found: error
